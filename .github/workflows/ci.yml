name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_ENV: test
      PORT: "3000"
      MONGODB_URI: "mongodb://127.0.0.1:27017/test-ci"
      JWT_ACCESS_SECRET: "ci-dummy-jwt-access-secret-48-bytes-long-hex-mock-key-only"
      JWT_REFRESH_SECRET: "ci-dummy-jwt-refresh-secret-48-bytes-long-hex-mock-key-only"
      AI_PROVIDER: mock
      DEMO_LOGIN_ENABLED: "true"
      STUN_URLS: "stun:stun.l.google.com:19302"
      LOG_LEVEL: "warn"
      # Store mongodb-memory-server download inside npm cache directory so setup-node cache covers it
      MONGOMS_DOWNLOAD_DIR: "/home/runner/.npm/mongodb-binaries"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Lockfile was produced on Windows; npm install avoids platform-specific npm ci failures on optional native packages
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intellmeet:ci .
